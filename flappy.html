<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Flappy Bird 🐤</title>
<style>
  html,body { margin:0; height:100%; overflow:hidden; touch-action:none;
              -webkit-user-select:none; user-select:none; background:#4ec0ca; }
  canvas { display:block; margin:0 auto; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<script>
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');

// 逻辑分辨率（竖屏手机比例），等比缩放适配任意屏幕
const GW = 400, GH = 640;
function resize(){
  const s = Math.min(innerWidth/GW, innerHeight/GH);
  cv.width = GW*s; cv.height = GH*s;
  cv.style.width = GW*s+'px'; cv.style.height = GH*s+'px';
  cv.style.marginTop = (innerHeight-GH*s)/2+'px';
  ctx.setTransform(s,0,0,s,0,0);
}
resize(); addEventListener('resize', resize);

// ---------- 游戏常量 ----------
const GRAV = 1500, FLAP = -420, PIPE_W = 60, GAP0 = 170, GAP_MIN = 120;
const SPEED0 = 140;

// ---------- 状态 ----------
let bird, pipes, score, best = +(localStorage.getItem('fb_best')||0);
let state, groundX, frames, speed, gap;

function reset(){
  bird = {x:100, y:GH/2, v:0, r:14, rot:0};
  pipes = [];
  score = 0; frames = 0; groundX = 0;
  speed = SPEED0; gap = GAP0;
  state = 'ready';
}
reset();

// ---------- 音效 ----------
let AC = null;
function beep(f, d, type='square', vol=0.06){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=f;
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);
    o.connect(g).connect(AC.destination);
    o.start(); o.stop(AC.currentTime+d);
  }catch(e){}
}

// ---------- 输入（鼠标 + 触屏 + 键盘） ----------
function tap(){
  if(state==='ready'){ state='play'; bird.v = FLAP; beep(600,0.08); }
  else if(state==='play'){ bird.v = FLAP; beep(600,0.08); }
  else if(state==='over'){ if(frames - overAt > 30) reset(); }
}
addEventListener('pointerdown', e=>{ e.preventDefault(); tap(); });
addEventListener('keydown', e=>{
  if(e.key===' '||e.key==='ArrowUp'){ e.preventDefault(); tap(); }
});

// ---------- 生成管道 ----------
function spawnPipe(){
  const margin = 70;
  const top = margin + Math.random()*(GH - gap - margin*2 - 90);
  pipes.push({x:GW+PIPE_W, top, passed:false});
}

// ---------- 碰撞 ----------
function circleRect(cx,cy,r, rx,ry,rw,rh){
  const nx = Math.max(rx, Math.min(cx, rx+rw));
  const ny = Math.max(ry, Math.min(cy, ry+rh));
  return (cx-nx)**2 + (cy-ny)**2 < r*r;
}

let overAt = 0;

// ---------- 更新 ----------
function update(dt){
  frames++;
  // 地面滚动（待机也滚）
  groundX = (groundX - speed*dt) % 24;

  if(state==='play'){
    // 难度渐进
    speed = SPEED0 + Math.min(score*3, 80);
    gap = Math.max(GAP_MIN, GAP0 - score*2);

    bird.v += GRAV*dt;
    bird.y += bird.v*dt;
    bird.rot = Math.max(-0.5, Math.min(1.4, bird.v/500));

    if(frames % Math.round(90*(SPEED0/speed)) === 0) spawnPipe();
    for(const p of pipes) p.x -= speed*dt;
    pipes = pipes.filter(p=>p.x > -PIPE_W-10);

    // 计分
    for(const p of pipes){
      if(!p.passed && p.x + PIPE_W < bird.x - bird.r){
        p.passed = true; score++; beep(900,0.07,'sine',0.07);
      }
    }

    // 碰撞
    for(const p of pipes){
      if(circleRect(bird.x,bird.y,bird.r, p.x,0,PIPE_W,p.top) ||
         circleRect(bird.x,bird.y,bird.r, p.x,p.top+gap,PIPE_W,GH)){
        die(); break;
      }
    }
    if(bird.y + bird.r >= GH-80) die();
    if(bird.y - bird.r < 0){ bird.y = bird.r; bird.v = 0; }
  } else if(state==='over'){
    bird.v += GRAV*dt;
    bird.y = Math.min(bird.y + bird.v*dt, GH-80-bird.r);
    bird.rot = Math.min(bird.rot+4*dt, 1.6);
  } else {
    // 待机：小鸟上下浮动
    bird.y = GH/2 + Math.sin(frames/20)*8;
    bird.rot = Math.sin(frames/20)*0.1;
  }
}
function die(){
  if(state!=='play') return;
  state = 'over'; overAt = frames;
  beep(200,0.3,'sawtooth',0.1);
  if(score > best){ best = score; localStorage.setItem('fb_best', best); }
}

// ---------- 绘制 ----------
function draw(){
  // 天空
  const sky = ctx.createLinearGradient(0,0,0,GH);
  sky.addColorStop(0,'#4ec0ca'); sky.addColorStop(1,'#9be2e8');
  ctx.fillStyle = sky; ctx.fillRect(0,0,GW,GH);

  // 云
  ctx.fillStyle='rgba(255,255,255,0.85)';
  for(let i=0;i<4;i++){
    const cx = ((frames*0.3 + i*140) % (GW+120)) - 60;
    const cy = 80 + i*55;
    ctx.beginPath();
    ctx.ellipse(cx,cy,34,13,0,0,7);
    ctx.ellipse(cx+26,cy-7,24,11,0,0,7);
    ctx.fill();
  }
  // 远处楼群
  ctx.fillStyle='#7fd4a0';
  for(let i=0;i<10;i++){
    const bx = ((i*70 - groundX*0.4) % (GW+70) + GW+70) % (GW+70) - 35;
    ctx.fillRect(bx, GH-140+((i*37)%40), 50, 140);
  }

  // 管道
  for(const p of pipes){
    const g = ctx.createLinearGradient(p.x,0,p.x+PIPE_W,0);
    g.addColorStop(0,'#5ebe31'); g.addColorStop(0.5,'#8ee04c'); g.addColorStop(1,'#4a9e26');
    ctx.fillStyle = g;
    ctx.fillRect(p.x, 0, PIPE_W, p.top);
    ctx.fillRect(p.x, p.top+gap, PIPE_W, GH-p.top-gap-80);
    // 管口帽
    ctx.fillRect(p.x-4, p.top-22, PIPE_W+8, 22);
    ctx.fillRect(p.x-4, p.top+gap, PIPE_W+8, 22);
  }

  // 地面
  ctx.fillStyle='#ded895';
  ctx.fillRect(0, GH-80, GW, 80);
  ctx.fillStyle='#7fc94b';
  ctx.fillRect(0, GH-80, GW, 12);
  ctx.fillStyle='#b8e289';
  for(let x=groundX; x<GW; x+=24) ctx.fillRect(x, GH-80, 12, 12);

  // 小鸟
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  ctx.fillStyle='#ffd93d';
  ctx.beginPath(); ctx.arc(0,0,bird.r,0,7); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.arc(5,-4,5,0,7); ctx.fill();
  ctx.fillStyle='#222';
  ctx.beginPath(); ctx.arc(6.5,-4,2.2,0,7); ctx.fill();
  ctx.fillStyle='#ff8c42';
  ctx.beginPath(); ctx.moveTo(12,0); ctx.lineTo(20,3); ctx.lineTo(12,6); ctx.fill();
  ctx.fillStyle='#f4b400';
  ctx.beginPath(); ctx.ellipse(-6,2,7,5,0,0,7); ctx.fill();
  // 翅膀扇动
  const wing = Math.sin(frames*0.4)*4;
  ctx.fillStyle='#e8a200';
  ctx.beginPath(); ctx.ellipse(-2,3+wing*0.3,7,4.5,-wing*0.05,0,7); ctx.fill();
  ctx.restore();

  // UI
  ctx.textAlign='center';
  if(state!=='ready'){
    ctx.fillStyle='#fff'; ctx.strokeStyle='#333'; ctx.lineWidth=4;
    ctx.font='bold 44px sans-serif';
    ctx.strokeText(score, GW/2, 80); ctx.fillText(score, GW/2, 80);
  }

  if(state==='ready'){
    ctx.fillStyle='#fff'; ctx.strokeStyle='#333'; ctx.lineWidth=4;
    ctx.font='bold 40px sans-serif';
    ctx.strokeText('Flappy Bird', GW/2, 200); ctx.fillText('Flappy Bird', GW/2, 200);
    ctx.font='16px sans-serif';
    ctx.fillStyle='#fff';
    ctx.fillText('点击屏幕 / 按空格 起飞', GW/2, 250);
    ctx.fillText('最高分: '+best, GW/2, 280);
    // 提示手指
    ctx.font='30px sans-serif';
    ctx.globalAlpha = 0.5+0.5*Math.sin(frames/15);
    ctx.fillText('👆 点我', GW/2, GH/2+90);
    ctx.globalAlpha = 1;
  }
  if(state==='over'){
    ctx.fillStyle='rgba(0,0,0,0.4)'; ctx.fillRect(0,0,GW,GH);
    ctx.fillStyle='#fff'; ctx.strokeStyle='#333'; ctx.lineWidth=4;
    ctx.font='bold 36px sans-serif';
    ctx.strokeText('游戏结束', GW/2, GH/2-60); ctx.fillText('游戏结束', GW/2, GH/2-60);
    ctx.font='22px sans-serif';
    ctx.fillText('得分: '+score, GW/2, GH/2-15);
    ctx.fillStyle='#ffd700';
    ctx.fillText('最高分: '+best, GW/2, GH/2+18);
    if(score>=10) { ctx.fillStyle='#ffd700'; ctx.font='bold 20px sans-serif';
      ctx.fillText(score>=30?'🏆 鸟中之王!':'🥉 不错!', GW/2, GH/2+50); }
    if(frames-overAt>30){
      ctx.fillStyle='#fff'; ctx.font='16px sans-serif';
      ctx.globalAlpha = 0.5+0.5*Math.sin(frames/12);
      ctx.fillText('点击重新开始', GW/2, GH/2+90);
      ctx.globalAlpha=1;
    }
  }
}

// ---------- 主循环 ----------
let last = performance.now();
function loop(now){
  const dt = Math.min((now-last)/1000, 0.04);
  last = now;
  update(dt); draw();
  requestAnimationFrame(loop);
}
// 自动测试：?test=1 时每 0.5s 拍翅并把状态打到控制台
if(location.search.includes('test')){
  state='play'; bird.v=FLAP;
  setInterval(()=>{ if(state==='play') bird.v=FLAP; },500);
  // 无头模式 rAF 节流：用 interval 定步长驱动
  setInterval(()=>{ update(0.033); draw(); },33);
  setInterval(()=>console.log('FB', JSON.stringify({s:score,y:+bird.y.toFixed(0),st:state,p:pipes.length})),1000);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
